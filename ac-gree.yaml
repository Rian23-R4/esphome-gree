substitutions:
  name: ac-gree
  friendly_name: Gree AC

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  min_auth_mode: WPA2
  power_save_mode: none
  # ESP32-C3 Super Mini: 20dB/defaults cause "Auth Expired" loops on some APs.
  output_power: 10dB
  ap:
    ssid: Gree-AC-Fallback
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

# IR LED on GPIO4, driven through 2N2222A (base resistor ~220 ohm).
remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

# TL1838 demodulator on GPIO5 — captures any remote frame (log: remote.pronto).
remote_receiver:
  pin:
    number: GPIO5
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 50%
  # idle: 30ms   # uncomment to merge the two Gree blocks into one capture

climate:
  - platform: gree
    name: Gree AC
    model: yac1fb9   # try yaw1f if modes misbehave

sensor:
  - platform: internal_temperature
    name: Chip Temperature
    update_interval: 60s

# ---------------------------------------------------------------------------
# Eco (SE) and DRED buttons.
# Frames below: Cool 24 C base. Regenerate for other temps:
#   python3 tools/gree_ir_builder.py --temp 25 --dred d2
